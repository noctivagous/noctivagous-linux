# Noctivagous Recovery — systemd-boot entry.
# Installed to /boot/loader/entries/nct-recovery.conf by the
# recovery package. Always present in the boot menu (§5: entry,
# a boot-menu entry, always) and offered first after repeated
# failed boots (nct-recovery-manager's should_offer_recovery).
# The kernel parameter nct.recovery=1 is how the recovery stack
# knows to start (recovery_backend.RECOVERY_PARAM); the recovery
# environment boots on the render ladder's lowest rung — basic
# driver, fixed resolution — never the full desktop stack.
title   Noctivagous Recovery
linux   /vmlinuz
initrd  /initrd.img
options root=LABEL=NCTROOT rw nct.recovery=1 systemd.unit=nct-recovery.target
